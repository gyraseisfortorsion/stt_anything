[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stt-anything"
version = "0.2.0"
description = "Modular acoustic keyword spotting with timestamped glossary matches"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "numba>=0.60,<1"]

[project.optional-dependencies]
whisper = ["openai-whisper>=20250625"]
piper = ["piper-tts>=1.4,<2", "huggingface-hub>=0.25,<2"]
phoneme = ["transformers>=4.44,<5", "phonemizer>=3.3,<4", "torch>=2.2", "huggingface-hub>=0.25,<2"]
russian = ["transformers>=4.44,<5", "torch>=2.2", "huggingface-hub>=0.25,<2"]
local = ["stt-anything[whisper,piper]"]
evaluation = ["psutil>=5.9,<8"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.13,<1", "mypy>=1.18,<2", "types-psutil", "stt-anything[evaluation]"]

[project.scripts]
stt-anything = "stt_anything.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["stt_anything"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=stt_anything --cov=demo --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["stt_anything", "demo"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = []

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
files = ["stt_anything", "demo"]
strict = true

[[tool.mypy.overrides]]
module = ["scipy.*", "numba.*", "whisper.*", "piper.*", "transformers.*", "huggingface_hub.*", "torch.*"]
ignore_missing_imports = true
follow_imports = "skip"
